<h2>Add New Customer</h2>
<form #formHotel="ngForm" (ngSubmit)="submitCustomerForm()">
  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer First Name</mat-label>
    <input
      matInput
      name="first_name"
      placeholder="Enter Customer First Name"
      [(ngModel)]="customer.first_name"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Middle Name</mat-label>
    <input
      matInput
      name="middle_name"
      placeholder="Enter Customer Middle Name"
      [(ngModel)]="customer.middle_name"
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Last Name</mat-label>
    <input
      matInput
      name="last_name"
      placeholder="Enter Customer Last Name"
      [(ngModel)]="customer.last_name"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Country</mat-label>
    <input
      matInput
      name="country"
      placeholder="Enter Your Country Name"
      [(ngModel)]="customer.country"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Address</mat-label>
    <input
      matInput
      name="address"
      placeholder="Enter Your Address"
      [(ngModel)]="customer.address"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Email</mat-label>
    <input
      matInput
      type="email"
      name="price"
      placeholder="Enter Customer Email"
      [(ngModel)]="customer.email"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Phone</mat-label>
    <input
      matInput
      type="telephone"
      name="phone"
      placeholder="Enter Customer Phone"
      [(ngModel)]="customer.phone"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Country</mat-label>
    <input
      matInput
      name="country"
      placeholder="Enter Customer Country"
      [(ngModel)]="customer.country"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Address</mat-label>
    <input
      matInput
      name="address"
      placeholder="Enter Customer Address"
      [(ngModel)]="customer.address"
      required
    />
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Customer Type</mat-label>

    <mat-select
      [(ngModel)]="customer.customer_type"
      name="customer_type"
      required
    >
      <mat-option
        *ngFor="let customer_type of customerType | keyvalue"
        [value]="customer_type.value"
      >
        {{ customer_type.key }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button
    [disabled]="!formHotel.valid"
    mat-raised-button
    type="submit"
    color="primary"
  >
    CREATE
  </button>
</form>
