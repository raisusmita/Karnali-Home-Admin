<mat-drawer-container class="container" autosize>
  <mat-drawer #drawer class="sidenav" mode="side" opened="true">
    <mat-list>
      <!-- <mat-list-item class="logo"> -->
      <!-- <img class="logo-img" src="assets/img/logo.jpg" /> -->
      <!-- <span >Aqore</span> -->
      <!-- </mat-list-item> -->
      <mat-list-item *ngFor="let component of components">
        <button mat-button class="btn-color" routerLink="/{{ component.path }}">
          <mat-icon>{{ component.icon }}</mat-icon>
          {{ component.name }}
        </button>
      </mat-list-item>
    </mat-list>
  </mat-drawer>
  <div class="sidenav-content">
    <mat-toolbar>
      <mat-toolbar-row>
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span> Karnali Home</span>
        <span class="spacer"></span>
        <mat-icon>account_circle</mat-icon>
      </mat-toolbar-row>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </div>
</mat-drawer-container>
