<div class="container">
  <button mat-raised-button class="button-blue" (click)="addRoom()">
    <mat-icon>add</mat-icon>
    Add New Room
  </button>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!--- Note that these columns can be defined in any order.
      The actual rendered columns are set as a property on the row definition" -->

    <!-- Weight Column -->

    <ng-container matColumnDef="room_number">
      <th mat-header-cell *matHeaderCellDef>room_number</th>
      <td mat-cell *matCellDef="let element">{{ element.room_number }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="number_of_bed">
      <th mat-header-cell *matHeaderCellDef>number_of_bed</th>
      <td mat-cell *matCellDef="let element">{{ element.number_of_bed }}</td>
    </ng-container>

    <ng-container matColumnDef="phone_number">
      <th mat-header-cell *matHeaderCellDef>phone_number</th>
      <td mat-cell *matCellDef="let element">{{ element.phone_number }}</td>
    </ng-container>

    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef>created_at</th>
      <td mat-cell *matCellDef="let element">{{ element.created_at }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element; let i = index">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button class="mat-menu-item" (click)="editRoom(element)">
            <mat-icon>create</mat-icon>
            <span>Edit</span>
          </button>
          <button class="mat-menu-item" (click)="deleteRoom(element.id)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
