<div class="container">
  <button mat-raised-button class="button-blue" (click)="onAddClick()">
    <mat-icon>add</mat-icon>
    Add New Room Category
  </button>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID.</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef>Image</th>
      <td mat-cell *matCellDef="let element">
        <img
          src="{{ element.image }}"
          alt="Image of RoomCategory"
          height="100"
          width="150"
        />
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="room_category">
      <th mat-header-cell *matHeaderCellDef>Room Category</th>
      <td mat-cell *matCellDef="let element">{{ element.room_category }}</td>
    </ng-container>

    <ng-container matColumnDef="room_type">
      <th mat-header-cell *matHeaderCellDef>Room Type</th>
      <td mat-cell *matCellDef="let element">{{ element.room_type }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="number_of_room">
      <th mat-header-cell *matHeaderCellDef>Number of Room</th>
      <td mat-cell *matCellDef="let element">{{ element.number_of_room }}</td>
    </ng-container>

    <ng-container matColumnDef="room_price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let element">$ {{ element.room_price }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element; let i = index">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button class="mat-menu-item" (click)="onEditClick(element)">
            <mat-icon>create</mat-icon>
            <span>Edit</span>
          </button>
          <button class="mat-menu-item" (click)="onDeleteClick(i)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
