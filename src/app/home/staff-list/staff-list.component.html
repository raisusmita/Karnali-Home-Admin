<mat-card class="example-card">
  <mat-card-header>
    <mat-card-title>Hotel Staff</mat-card-title>
  </mat-card-header>
  <hr />

  <mat-card-content>
    <mat-list role="list" *ngFor="let user of users; let i = index">
      <mat-list-item role="listitem">{{
        i + 1 + '. ' + user.name + '(' + user.role + ')'
      }}</mat-list-item>
    </mat-list>
  </mat-card-content>
</mat-card>
