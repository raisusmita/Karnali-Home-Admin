<block-ui>
  <div class="container">
    <button mat-raised-button class="button-blue" (click)="onAddClick()">
      <mat-icon>add</mat-icon>
      Add New Room Category
    </button>
    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->

        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef>Image</th>
          <td mat-cell *matCellDef="let element">
            <img
              src="{{ element.image }}"
              alt="Image of RoomCategory"
              height="100"
              width="150"
            />
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="room_category">
          <th mat-header-cell *matHeaderCellDef>Room Category</th>
          <td mat-cell *matCellDef="let element">
            {{ element.room_category }}
          </td>
        </ng-container>

        <ng-container matColumnDef="room_type">
          <th mat-header-cell *matHeaderCellDef>Room Type</th>
          <td mat-cell *matCellDef="let element">{{ element.room_type }}</td>
        </ng-container>

        <ng-container matColumnDef="number_of_rooms">
          <th mat-header-cell *matHeaderCellDef>Number of rooms</th>
          <td mat-cell *matCellDef="let element">
            {{ element.number_of_rooms }}
          </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="number_of_room">
          <th mat-header-cell *matHeaderCellDef>Number of Room</th>
          <td mat-cell *matCellDef="let element">
            {{ element.number_of_room }}
          </td>
        </ng-container>

        <ng-container matColumnDef="room_price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let element">
            {{ element.room_price | currency: 'NPR ':'symbol' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <mat-icon
              *ngIf="ActionPermissions.Edit"
              matTooltip="Edit Room Category"
              class="text-secondary mr-2 pointed"
              (click)="onEditClick(element)"
              >create</mat-icon
            >
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <div class="pagination-footer mat-elevation-z8">
      <mat-paginator
        [length]="totalLength"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        (page)="onPageChange($event)"
        [pageSizeOptions]="pageSizeOptions"
      >
      </mat-paginator>
    </div>
  </div>
</block-ui>
