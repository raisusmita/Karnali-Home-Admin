<div class="container">
  <block-ui>
    <div class="p-3 mt-3" *ngIf="!isEdit">
      <form class="example-form">
        <div class="row">
          <div class="col-sm-6">
            <div class="text-center m-3">
              <h3>Table</h3>
            </div>
            <button
              *ngFor="let tableData of table"
              type="button"
              class="btn btn-outline-info m-2"
              [ngClass]="{
                'btn-info':
                  selectedTableNo &&
                  selectedTableNo == tableData['table_number'],
                'text-white':
                  selectedTableNo &&
                  selectedTableNo == tableData['table_number']
              }"
              (click)="selectTable(tableData['table_number'])"
            >
              {{ tableData['table_number'] }}
            </button>

          </div>

          <div class="col-sm-6">
            <div class="text-center m-3">
              <h3>Room</h3>
            </div>
            <button
              *ngFor="let roomData of room"
              type="button"
              class="btn btn-outline-info m-2"
              [ngClass]="{
                'btn-info':
                  selectedRoomNo && selectedRoomNo == roomData['room_number'],
                'text-white':
                  selectedRoomNo && selectedRoomNo == roomData['room_number']
              }"
              (click)="selectRoom(roomData['room_number'])"
            >
              {{ roomData['room_number'] }}
            </button>

                >
                  {{ roomOption.room_number }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field> -->
          </div>
        </div>
      </form>
    </div>

    <div class="row mt-4" *ngIf="mainFood">
      <div class="col-md-3 col-sm-4" *ngIf="selectedTableNo || selectedRoomNo">
        <div class="mb-2" *ngFor="let mainFoodItem of mainFood">
          <div
            class="main-food-card"
            (click)="getSubFoodAndFoodItems(mainFoodItem)"
          >
            <div
              class="main-food-checked"
              *ngIf="mainFoodChecked[mainFoodItem.id] > 0"
            >
              <img
                src="../../../assets/images/check_circle_outline-24px.svg"
                alt="checked"
              />
            </div>
            <h5>
              {{ mainFoodItem.main_food_name }}
            </h5>
          </div>
        </div>
      </div>

      <!-- *ngIf="subFoodShow" -->
      <div
        class="col-md-9 col-sm-8"
        *ngIf="
          mainFoodSelectedId &&
          foodList[mainFoodSelectedId] &&
          foodList[mainFoodSelectedId]['subFood']
        "
      >
        <div
          class="mb-2"
          *ngFor="
            let subFoodItem of foodList[mainFoodSelectedId]['subFood'];
            let i = index
          "
        >
          Sub Food:
          <mat-accordion class="example-headers-align">
            <mat-expansion-panel [expanded]="step === i" (opened)="setStep(i)">
              <mat-expansion-panel-header>
                <mat-panel-title>
                  <h5>
                    {{ subFoodItem.sub_food_name }}
                  </h5>
                </mat-panel-title>
              </mat-expansion-panel-header>

              <div *ngFor="let foodItem of subFoodItem.foodItems">
                <h6 class="my-2">
                  <!-- {{ foodItem | json }} -->
                </h6>
                <div class="d-flex mb-3">
                  <mat-checkbox
                    [checked]="foodOrderList[foodItem.id]"
                    color="primary"
                    (change)="storeFoodOrder($event, foodItem)"
                  >
                    {{ foodItem.food_name }}
                  </mat-checkbox>

                  <div class="border ml-3 p-1 w-5">
                    <input
                      matInput
                      type="number"
                      [value]="
                        foodOrderList[foodItem.id]
                          ? foodOrderList[foodItem.id]['quantity']
                          : '1'
                      "
                      min="1"
                      (change)="maintainOrderQuantity($event, foodItem)"
                    />
                  </div>
                </div>
              </div>
            </mat-expansion-panel>
          </mat-accordion>
        </div>

        <hr />

        <div
          *ngIf="
            mainFoodSelectedId &&
            foodList[mainFoodSelectedId] &&
            foodList[mainFoodSelectedId]['foodItems']
          "
        >
          <div
            class="mb-3"
            *ngFor="
              let foodItem of foodList[mainFoodSelectedId].foodItems | keyvalue;
              let i = index
            "
          >
            <!-- <mat-accordion class="example-headers-align">
              <mat-expansion-panel
                [expanded]="step === i"
                (opened)="setStep(i)"
                class="custom-panel"
              >
                <mat-expansion-panel-header>
                  <mat-panel-title>
                    <h5></h5>
                  </mat-panel-title>
                </mat-expansion-panel-header>

                <div *ngIf="foodItem.value">
                  <div
                    class="d-flex mb-3"
                    *ngFor="let foodItemDetail of foodItem.value"
                  >
                    <mat-checkbox
                      [checked]="foodOrderList[foodItemDetail.id]"
                      color="primary"
                      (change)="storeFoodOrder($event, foodItemDetail)"
                    >
                      {{ foodItemDetail.food_name }}
                    </mat-checkbox>
                    <div class="border ml-3 p-1 w-5">
                      <input
                        matInput
                        type="number"

                            : '1'

                      />
                    </div>
                  </div>
                </div>
              </mat-expansion-panel>
            </mat-accordion> -->
          </div>
        </div>

        <button
          *ngIf="!isEdit"
          class="btn btn-primary"
          (click)="storeFoodOrderList()"
        >
          Save Order
        </button>

        <button
          *ngIf="isEdit"
          class="btn btn-primary"
          (click)="editFoodOrder()"
        >
          Edit Order
        </button>

        <button
          *ngIf="isEdit"
          class="btn btn-warning ml-3"
          (click)="cancelOrderEdit()"
        >
          Go Back
        </button>
      </div>
    </div>
  </block-ui>
</div>
