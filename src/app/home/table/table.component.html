<block-ui>
  <div class="container">
    <button mat-raised-button class="button-blue" (click)="addTable()">
      <mat-icon>add</mat-icon>
      Add New Table
    </button>

    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Weight Column -->

        <ng-container matColumnDef="table_number">
          <th mat-header-cell *matHeaderCellDef>Table Number</th>
          <td mat-cell *matCellDef="let element">{{ element.table_number }}</td>
        </ng-container>

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Created At</th>
          <td mat-cell *matCellDef="let element">{{ element.created_at }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <mat-icon
              *ngIf="ActionPermissions.Edit"
              matTooltip="Edit Table"
              class="text-secondary mr-2 pointed"
              (click)="editTable(element)"
              >create</mat-icon
            >
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <div class="pagination-footer mat-elevation-z8">
      <mat-paginator
        [length]="totalLength"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        (page)="onPageChange($event)"
        [pageSizeOptions]="pageSizeOptions"
      >
      </mat-paginator>
    </div>
  </div>
</block-ui>
